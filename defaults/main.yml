---
# =============================================================================
# mongodb8_cis — user-facing settings (CIS MongoDB 8 Benchmark v2.0.0)
# Override in group_vars/host_vars; never edit tasks to change behaviour.
# =============================================================================

# --- Install (opt-in) --------------------------------------------------------
# true = add the official MongoDB Enterprise repo and install mongodb-enterprise when missing.
mongodb8_cis_install: false
# Release series in the repo URL: repo.mongodb.com/yum/redhat/<os>/mongodb-enterprise/<version>/
# Supported: "8.0" (CIS MongoDB 8 Benchmark). Other series are stopped in prelim.
mongodb8_cis_version: "8.0"

# --- CIS levels ---------------------------------------------------------------
# Each rule is Level 1 or Level 2 in the benchmark. For Level 2, set BOTH to true (Level 2 extends Level 1).
mongodb8_cis_level_1: true
mongodb8_cis_level_2: false

# --- Sections -----------------------------------------------------------------
mongodb8_cis_section1: true  # Installation and Patching
mongodb8_cis_section2: true  # Authentication
mongodb8_cis_section3: true  # Authorization
mongodb8_cis_section4: true  # Data Encryption
mongodb8_cis_section5: true  # Audit Logging
mongodb8_cis_section6: true  # Operating System Hardening
mongodb8_cis_section7: true  # File Permissions

# --- Rule toggles (true = rule runs, if its section and level are also on) ---
# Rules that can lock users out or break clients are false by default (2.1, 2.2, 4.3, 4.4, 6.1, D6):
# turn each one on only after its site values, the TLS certificates and the client configs are ready.

# Section 1 - Installation and Patching
# 1.1 (L1, Manual) Ensure the appropriate MongoDB software version/patches are installed
mongodb8_cis_rule_1_1: true

# Section 2 - Authentication
# 2.1 (L1, Automated) Ensure Authentication is configured
# WARNING: enables authorization; clients without a user can no longer read or write.
mongodb8_cis_rule_2_1: false
# 2.2 (L1, Automated) Ensure that MongoDB does not bypass authentication via the localhost exception
# WARNING: removes the localhost login used when no user exists (the rule checks a user exists first).
mongodb8_cis_rule_2_2: false
# Site values for 2.1: the admin user created before authorization is enabled (role root on admin, as in the CIS
# remediation). The role also logs in with it for the 2.x/3.x database reads once authorization is on.
# Keep the password in Ansible Vault. It must not contain spaces, quotes or backslashes (mongodb_shell passes it unquoted).
mongodb8_cis_admin_user: ""
mongodb8_cis_admin_password: ""
# 2.3 (L2, Automated) Ensure authentication is enabled in the sharded cluster
# Sharded clusters only; this role targets standalone mongod.
mongodb8_cis_rule_2_3: false

# Section 3 - Authorization
# 3.1 (L1, Manual) Ensure least privilege for database accounts
mongodb8_cis_rule_3_1: true
# Site decision (D20): accounts to revoke dbOwner/userAdmin/userAdminAnyDatabase in admin from, written as the 3.1
# report names them (<database>.<user>), e.g. ["admin.badadmin"]. Default [] = report only. The account and its other
# roles stay. WARNING: read the 3.1 report first; a listed admin loses those roles.
mongodb8_cis_revoke_admin_roles: []
# 3.2 (L1, Manual) Ensure that role-based access control is enabled and configured appropriately
mongodb8_cis_rule_3_2: true
# 3.3 (L1, Manual) Ensure that MongoDB is run using a non-privileged, dedicated service account
mongodb8_cis_rule_3_3: true
# 3.4 (L1, Manual) Ensure that each role for each MongoDB database is needed and grants only the necessary privileges
mongodb8_cis_rule_3_4: true
# 3.5 (L2, Manual) Review Superuser/Admin Roles
mongodb8_cis_rule_3_5: true

# Section 4 - Data Encryption
# 4.1 (L2, Automated) Ensure legacy TLS protocols are disabled
mongodb8_cis_rule_4_1: true
# 4.2 (L1, Automated) Ensure Weak Protocols are Disabled
mongodb8_cis_rule_4_2: true
# 4.3 (L1, Automated) Ensure Encryption of Data in Transit TLS or SSL (Transport Encryption)
mongodb8_cis_rule_4_3: false
# Site values for 4.3 (PEM files must already be on the host). Empty = keep the values already in mongod.conf.
# WARNING: requireTLS rejects every client that does not use TLS (and, with a CAFile, every client without a certificate).
mongodb8_cis_tls_certificate_key_file: ""
mongodb8_cis_tls_ca_file: ""
# Client certificate the role's own mongosh presents when TLS is on. Empty = the server certificateKeyFile
# (needs extendedKeyUsage clientAuth, or no EKU).
mongodb8_cis_shell_tls_certificate_key_file: ""
# 4.4 (L2, Automated) Ensure Federal Information Processing Standard (FIPS) is enabled
# Needs TLS (4.3). WARNING: FIPS mode disables SCRAM-SHA-1 and non-FIPS ciphers.
mongodb8_cis_rule_4_4: false
# 4.5 (L2, Manual) Ensure Encryption of Data at Rest
mongodb8_cis_rule_4_5: true

# Section 5 - Audit Logging
# 5.1 (L1, Automated) Ensure that system activity is audited
mongodb8_cis_rule_5_1: true
# Site values for 5.1, used only when mongod.conf has no auditLog.destination (an existing one is never changed).
# CIS lists syslog, console or file and does not pick one. syslog: rotated and forwarded by the OS log stack.
# file: also set the format (JSON or BSON; CIS: JSON is slower). Rotation of a file is the site's job.
# WARNING: auditing adds load and log volume. Enabling it restarts mongod.
mongodb8_cis_audit_destination: syslog
mongodb8_cis_audit_format: JSON
# file only. Empty = auditLog.json/.bson in the directory of systemLog.path.
mongodb8_cis_audit_path: ""
# 5.2 (L2, Manual) Ensure that audit filters are configured properly
mongodb8_cis_rule_5_2: true
# Site decision (D20): the audit filter your organisation requires, written to auditLog.filter (only when auditing is
# on, 5.1). Default "" = report only; no filter means every auditable event is recorded.
# e.g. '{ atype: { $in: [ "authenticate", "createUser", "dropUser" ] } }'
# WARNING: a filter records less than the default; agree it with the security team.
mongodb8_cis_audit_filter: ""
# 5.3 (L2, Automated) Ensure that logging captures as much information as possible
mongodb8_cis_rule_5_3: true
# 5.4 (L2, Automated) Ensure that new entries are appended to the end of the log file
mongodb8_cis_rule_5_4: true

# Section 6 - Operating System Hardening
# 6.1 (L1, Automated) Ensure that MongoDB uses a non-default port
mongodb8_cis_rule_6_1: false
# Site value for 6.1 (CIS: "Organisation Defined port"). No default is invented: set it, or 6.1 stops with a message.
# WARNING: changing the port breaks every client and connection string that uses 27017.
# Must be 1024-65535 (mongod runs as a non-root user and cannot bind lower ports).
mongodb8_cis_port: ""
# 6.2 (L2, Manual) Ensure that operating system resource limits are set for MongoDB
mongodb8_cis_rule_6_2: true
# Site decision (D20): true = write mongodb8_cis_resource_limits as a systemd drop-in for mongod (+ restart) when the
# limits systemd applies differ. Default false = report only. The RPM's unit file is never edited.
mongodb8_cis_fix_resource_limits: false
# Expected limits (CIS 6.2 remediation values; CIS: "Every deployment may have unique requirements").
mongodb8_cis_resource_limits:
  LimitFSIZE: infinity   # f  file size
  LimitCPU: infinity     # t  cpu time
  LimitAS: infinity      # v  virtual memory
  LimitNOFILE: 64000     # n  open files
  LimitRSS: infinity     # m  memory size
  LimitNPROC: 64000      # u  processes/threads
# 6.3 (L2, Manual) Ensure that server-side scripting is disabled if not needed
mongodb8_cis_rule_6_3: true
# Site decision (D20): false = your apps do NOT use server-side JavaScript ($where, mapReduce, $function, $accumulator)
# -> the role sets security.javascriptEnabled: false. Default true = report only.
# WARNING: CIS impact: "Disabling server-side scripting will block all server-side scripts from executing."
mongodb8_cis_javascript_needed: true

# Section 7 - File Permissions
# 7.1 (L1, Manual) Ensure appropriate key file permissions are set
mongodb8_cis_rule_7_1: true
# Site decision (D20): true = set the existing keyFile / TLS key / CA files to 0600, owner and group = mongod user
# (CIS: chmod 600). Default false = report only. Missing files are never created.
mongodb8_cis_fix_key_file_permissions: false
# 7.2 (L1, Manual) Ensure appropriate database file permissions are set.
mongodb8_cis_rule_7_2: true
# Site decision (D20): true = also FIX the dbPath directory to 0770, owner/group = mongod user.
# Default false = report only (CIS marks 7.2 Manual). The RPM ships the directory as 0755.
mongodb8_cis_fix_db_path_permissions: false

# --- Optional extra, not a CIS recommendation ---------------------------------
# true = confine mongod with MongoDB's SELinux policy module (D17), when SELinux is enabled:
# RHEL 9/10: build MongoDB's module on the host (installs selinux-policy-devel, make, checkpolicy) and load it;
# RHEL 8: the base policy's mongodb module already confines mongod, so only labels are added.
# All: label a non-default dbPath, log directory and port.
# WARNING: a confined mongod can only use labelled paths and ports. Test on a non-production host first.
mongodb8_cis_selinux_policy: false
