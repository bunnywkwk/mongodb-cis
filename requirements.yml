---
# Install on the control node before using the role:
#   ansible-galaxy collection install -r requirements.yml
# mongodb_shell only needs mongosh on the database servers,
# which the mongodb-enterprise package already installs.
collections:
  - name: community.mongodb
    version: ">=1.8.0,<2.0.0"
  # seport (6.1). 11.x is the last line that supports ansible-core 2.16 (RHEL 8 env).
  - name: community.general
    version: ">=11.0.0,<12.0.0"
