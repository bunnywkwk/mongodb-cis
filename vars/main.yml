---
# mongodb8_cis internal values: worked out by the role, not set by users (their choices are in defaults/main.yml).

## Supported targets
mongodb8_cis_supported_os_majors: ["8", "9", "10"]
mongodb8_cis_supported_versions: ["8.0"]   # CIS MongoDB 8 Benchmark v2.0.0

## MongoDB Enterprise package (MongoDB's install docs)
mongodb8_cis_repo_name: "mongodb-enterprise-{{ mongodb8_cis_version }}"
mongodb8_cis_repo_baseurl: "https://repo.mongodb.com/yum/redhat/{{ ansible_facts['distribution_major_version'] }}/mongodb-enterprise/{{ mongodb8_cis_version }}/$basearch/"
mongodb8_cis_repo_gpgkey: "https://pgp.mongodb.com/server-{{ mongodb8_cis_version }}.asc"
mongodb8_cis_package: mongodb-enterprise
mongodb8_cis_server_package: mongodb-enterprise-server
mongodb8_cis_service: mongod

## Paths and RPM defaults
mongodb8_cis_conf_path: /etc/mongod.conf
mongodb8_cis_limits_dropin: /etc/systemd/system/mongod.service.d/mongodb8_cis-limits.conf   # 6.2
mongodb8_cis_default_db_path: /var/lib/mongo
mongodb8_cis_default_log_path: /var/log/mongodb/mongod.log
mongodb8_cis_default_user: mongod

## Found on the host (prelim)
discovered_mongodb_version: "{{ ansible_facts['packages'][mongodb8_cis_server_package][0]['version'] }}"
mongodb8_cis_service_user: "{{ discovered_mongod_service['status']['User'] | default(mongodb8_cis_default_user, true) }}"

## TLS (4.3): TLS is turned on in this run when the rule is on and both files have a source and a destination
mongodb8_cis_tls_ready: >-
  {{ mongodb8_cis_section4 and mongodb8_cis_rule_4_3 and mongodb8_cis_level_1
     and mongodb8_cis_tls_certificate_key_src | length > 0 and mongodb8_cis_tls_ca_src | length > 0
     and mongodb8_cis_tls_certificate_key_file | length > 0 and mongodb8_cis_tls_ca_file | length > 0 }}

## From the config being built (mongodb8_cis_conf)
mongodb8_cis_tls_enabled: "{{ mongodb8_cis_conf['net']['tls']['mode'] | default('disabled') != 'disabled' }}"   # 4.1, 4.2, 4.4
mongodb8_cis_cluster_member: >-
  {{ mongodb8_cis_conf['sharding']['clusterRole'] is defined or mongodb8_cis_conf['replication']['replSetName'] is defined }}
mongodb8_cis_listen_port: "{{ mongodb8_cis_conf['net']['port'] | default(27017) }}"   # restart handler
mongodb8_cis_listen_host: "{{ (mongodb8_cis_conf['net']['bindIp'] | default('127.0.0.1')).split(',')[0] | replace('0.0.0.0', '127.0.0.1') }}"

## The role's own login (sections 2, 3): the config mongod runs with now, before this run's restart
mongodb8_cis_shell_host: "{{ (discovered_mongod_conf['net']['bindIp'] | default('127.0.0.1')).split(',')[0] | replace('0.0.0.0', '127.0.0.1') }}"
mongodb8_cis_shell_port: "{{ discovered_mongod_conf['net']['port'] | default(27017) }}"
mongodb8_cis_shell_auth: "{{ discovered_mongod_conf['security']['authorization'] | default('disabled') == 'enabled' }}"
mongodb8_cis_shell_tls: "{{ discovered_mongod_conf['net']['tls']['mode'] | default('disabled') == 'requireTLS' }}"
mongodb8_cis_shell_ca_file: "{{ discovered_mongod_conf['net']['tls']['CAFile'] | default('') }}"
mongodb8_cis_shell_client_cert: >-
  {{ mongodb8_cis_shell_client_cert_path
     if mongodb8_cis_shell_tls_certificate_key_src | length > 0 and mongodb8_cis_shell_client_cert_path | length > 0
     else discovered_mongod_conf['net']['tls']['certificateKeyFile'] | default('') }}

## 6.1: ports the RHEL SELinux policy already allows for mongod (mongod_port_t)
mongodb8_cis_selinux_default_ports: [27017, 27018, 27019, 28017, 28018, 28019]
