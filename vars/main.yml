---
# =============================================================================
# mongodb8_cis — internal values. Not meant to be overridden.
# Sources: docs/platform-notes.md (S1 install docs, S3 RPM inspection).
# =============================================================================

# Supported targets (RHEL family, verified in platform-notes).
mongodb8_cis_supported_os_majors: ["8", "9", "10"]
mongodb8_cis_supported_arch: x86_64

# Official MongoDB Enterprise repo (S1). Only the OS major and release series change.
mongodb8_cis_repo_name: "mongodb-enterprise-{{ mongodb8_cis_version }}"
mongodb8_cis_repo_baseurl: >-
  {{ 'https://repo.mongodb.com/yum/redhat/' ~ ansible_facts['distribution_major_version']
  ~ '/mongodb-enterprise/' ~ mongodb8_cis_version ~ '/$basearch/' }}
# Key file name: server-8.0.asc for 8.0; server-<major>.asc from 9.0 (S2).
mongodb8_cis_repo_key_series: "{{ mongodb8_cis_version if mongodb8_cis_version is version('9.0', '<') else mongodb8_cis_version.split('.')[0] }}"
mongodb8_cis_repo_gpgkey: "https://pgp.mongodb.com/server-{{ mongodb8_cis_repo_key_series }}.asc"

# MongoDB release series covered by the CIS MongoDB 8 Benchmark v2.0.0 (S5).
mongodb8_cis_supported_versions: ["8.0"]

# Package and service names (S1, S3).
mongodb8_cis_package: mongodb-enterprise
mongodb8_cis_server_package: mongodb-enterprise-server
mongodb8_cis_service: mongod
mongodb8_cis_conf_path: /etc/mongod.conf
# 6.2 limits drop-in (systemd reads <unit>.service.d/*.conf; the RPM's unit file stays untouched).
mongodb8_cis_limits_dropin: "/etc/systemd/system/{{ mongodb8_cis_service }}.service.d/mongodb8_cis-limits.conf"

# RPM defaults (S3). Fallbacks only: live values are read from mongod.conf (D8).
mongodb8_cis_default_db_path: /var/lib/mongo
mongodb8_cis_default_log_path: /var/log/mongodb/mongod.log
mongodb8_cis_default_user: mongod

# The user mongod really runs as (systemd unit User=), read in prelim; RPM default as fallback (D8).
mongodb8_cis_service_user: "{{ discovered_mongod_service['status']['User'] | default(mongodb8_cis_default_user, true) }}"

# Where mongod listens, from the live config (prelim). Used by the restart handler's port check.
# First bindIp entry; 0.0.0.0 (all interfaces) is checked on 127.0.0.1.
mongodb8_cis_listen_port: "{{ discovered_mongod_conf['net']['port'] | default(27017) }}"
mongodb8_cis_listen_host: "{{ (discovered_mongod_conf['net']['bindIp'] | default('127.0.0.1')).split(',')[0] | replace('0.0.0.0', '127.0.0.1') }}"

# SELinux (D11, D17; platform-notes "SELinux"). Ports the base policy already labels mongod_port_t on RHEL 8/9/10.
mongodb8_cis_selinux_default_ports: [27017, 27018, 27019, 28017, 28018, 28019]
# RHEL majors where MongoDB's own policy module builds (tested). RHEL 8: it does not build, and the base policy's
# mongodb module already confines mongod.
mongodb8_cis_selinux_build_os_majors: ["9", "10"]
# Where the module sources are copied and built on the host.
mongodb8_cis_selinux_src_dir: /usr/share/mongodb8_cis/selinux

# TLS is configured in mongod.conf (including edits made earlier in this run). mongod refuses TLS options without it.
mongodb8_cis_tls_enabled: "{{ discovered_mongod_conf['net']['tls']['mode'] | default('disabled') != 'disabled' }}"

# How the role's own mongosh reaches mongod (sections 2, 3; D24). Built from the config mongod is running with
# (prelim snapshot): edits made in this run only apply after the restart handler.
mongodb8_cis_shell_host: "{{ (discovered_mongod_running_conf['net']['bindIp'] | default('127.0.0.1')).split(',')[0] | replace('0.0.0.0', '127.0.0.1') }}"
mongodb8_cis_shell_port: "{{ discovered_mongod_running_conf['net']['port'] | default(27017) }}"
mongodb8_cis_shell_auth: "{{ discovered_mongod_running_conf['security']['authorization'] | default('disabled') == 'enabled' }}"
mongodb8_cis_shell_tls: "{{ discovered_mongod_running_conf['net']['tls']['mode'] | default('disabled') == 'requireTLS' }}"
mongodb8_cis_shell_ca_file: "{{ discovered_mongod_running_conf['net']['tls']['CAFile'] | default('') }}"
mongodb8_cis_shell_client_cert: >-
  {{ mongodb8_cis_shell_tls_certificate_key_file or discovered_mongod_running_conf['net']['tls']['certificateKeyFile'] | default('') }}

# pymongo for community.mongodb's mongodb_info / mongodb_user (D13a): its own virtualenv on each server.
# pymongo 4.9+ is fully compatible with MongoDB 8.0 and needs Python 3.9+ (RHEL 8's system Python is 3.6).
mongodb8_cis_pymongo_venv: /opt/mongodb8_cis/venv
mongodb8_cis_pymongo_spec: "pymongo>=4.9,<5"
mongodb8_cis_python_bin: /usr/bin/python3.12
mongodb8_cis_python_packages:
  "8": [python3.12, python3.12-pip]
  "9": [python3.12, python3.12-pip]
  "10": [python3, python3-pip]
