---
- name: "5.1 | AUDIT | Ensure that system activity is audited"
  when:
    - mongodb_cis_rule_5_1 | bool
    - mongodb_cis_level_1 | bool
  tags:
    - level1
    - automated
    - audit
    - rule_5.1
    - logging
  ansible.builtin.debug:
    msg: >-
      5.1 NOT APPLICABLE: auditing (auditLog) is available in MongoDB Enterprise only.
      This host runs Community {{ discovered_mongodb_version }}. Documented gap (design-decisions D9).

- name: "5.2 | AUDIT | Ensure that audit filters are configured properly"
  when:
    - mongodb_cis_rule_5_2 | bool
    - mongodb_cis_level_2 | bool
  tags:
    - level2
    - manual
    - audit
    - rule_5.2
    - logging
  ansible.builtin.debug:
    msg: >-
      5.2 NOT APPLICABLE: audit filters need auditLog, which is MongoDB Enterprise only.
      This host runs Community {{ discovered_mongodb_version }}. Documented gap (design-decisions D9).

- name: "5.3 | PATCH | Ensure that logging captures as much information as possible"
  when:
    - mongodb_cis_rule_5_3 | bool
    - mongodb_cis_level_2 | bool
    - discovered_mongod_conf['systemLog']['quiet'] | default(false) is true
  tags:
    - level2
    - automated
    - patch
    - rule_5.3
    - logging
  vars:
    mongodb_cis_5_3_settings:
      systemLog:
        quiet: false
  block:
    - name: "5.3 | PATCH | Ensure that logging captures as much information as possible | Set systemLog.quiet: false"
      ansible.builtin.copy:
        dest: "{{ mongodb_cis_conf_path }}"
        content: "{{ discovered_mongod_conf | combine(mongodb_cis_5_3_settings, recursive=true) | to_nice_yaml(indent=2) }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Restart mongod

    - name: "5.3 | PATCH | Ensure that logging captures as much information as possible | Update the parsed config"
      ansible.builtin.set_fact:
        discovered_mongod_conf: "{{ discovered_mongod_conf | combine(mongodb_cis_5_3_settings, recursive=true) }}"

- name: "5.4 | PATCH | Ensure that new entries are appended to the end of the log file"
  when:
    - mongodb_cis_rule_5_4 | bool
    - mongodb_cis_level_2 | bool
    - discovered_mongod_conf['systemLog']['logAppend'] | default(false) is not true
  tags:
    - level2
    - automated
    - patch
    - rule_5.4
    - logging
  vars:
    mongodb_cis_5_4_settings:
      systemLog:
        logAppend: true
  block:
    - name: "5.4 | PATCH | Ensure that new entries are appended to the end of the log file | Set systemLog.logAppend: true"
      ansible.builtin.copy:
        dest: "{{ mongodb_cis_conf_path }}"
        content: "{{ discovered_mongod_conf | combine(mongodb_cis_5_4_settings, recursive=true) | to_nice_yaml(indent=2) }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Restart mongod

    - name: "5.4 | PATCH | Ensure that new entries are appended to the end of the log file | Update the parsed config"
      ansible.builtin.set_fact:
        discovered_mongod_conf: "{{ discovered_mongod_conf | combine(mongodb_cis_5_4_settings, recursive=true) }}"
