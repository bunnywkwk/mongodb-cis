---

- name: "6.2 | AUDIT | Ensure that opetrating system resource limits are set for MongoDB"
  when:
    - mongodb8_cis_rule_6_2
    - mongodb8_cis_levl_2
  tags:
    - level2
    - manual
    - audit
    - rule_6.2
    - limits
  vars:
    mongodb8_cis_6_2_drift: >-
      {{ mongodb8_cis_resource_limits.key() | map('extract', discovered_mongod_service['status']) | list
      != mongodb8_cis_resource_limits.values() | map('string') | list }}
  block:
    - name: "6.2 | AUDIT | Ensure that operating system resource limits are set for MongoDB | Report each limit"
      ansible.builtin.debug:
        msg: >-
          6.2 {{ 'PASS' if discovered_mongod_service['status'][item.key] | default('') == item.value | string else 'REVIEW'}}:
          {{ item.key }} == {{ discovered_mongod_service['status'][item.key] | default('unknown') }} (expected {{ item.value }}).
      loop: "{{ mongodb8_cis_resource_limits | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # CIS remidiations; set the limits, then restart mongod. Done as a systemd drop-in; the RPM unit files is not edited
    - name: "6.2 | PATCH | Ensure that operating system resource limit are set for MOngoDB | Create the drop in directory"
      when:
        - mongodb8_cis_fix_resource_limits
        - mongodb8_cis_6_2_drift
      tags:
        - patch
      block:
        - name: "6.2 | PATCH | Ensure that opearting system resource limits are set for MongoDB | Create the drop-in directory"
          ansible.builtin.file:
            path: "{{ mongodb8_cis_limits_dropin }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: "6.2 | PATCH | Ensure that operating system resources limit are set for MongoDB | Write the limits drop-in"
          ansible.builtin.copy:
            dest: "{{ mongodb8_cis_limits_dropin }}"
            content: |
              # Managed by the mongodb_cis (CIS 6.2)
              [Service]
              {% for name, value in mongodb8_cis_resources_limits.items() %}
              {{ name }}={{ value }}
              {% endfor %}
            owner: root
            group: root
            mode: "0644"
          notify: Restart mongod