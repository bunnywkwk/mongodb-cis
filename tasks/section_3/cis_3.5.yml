---
- name: "3.5 | AUDIT | Review Superuser/Admin Roles"
  when:
    - mongodb8_cis_rule_3_5
    - mongodb8_cis_level_2
  tags:
    - level2
    - manual
    - audit
    - rule_3.5
    - authorization
  vars:
    mongodb8_cis_3_5_roles:
      - root
      - dbOwner
      - userAdmin
      - userAdminAnyDatabase
      - readWriteAnyDatabase
      - dbAdminAnyDatabase
      - clusterAdmin
      - hostManager
  block:
    - name: "3.5 | AUDIT | Review Superuser/Admin Roles | Find users with superuser or admin roles"
      community.mongodb.mongodb_shell:
        eval: >-
          db.getSiblingDB('admin').system.users.find({'roles.role': {$in: {{ mongodb8_cis_3_5_roles | to_json }}}},
          {_id: 0, user: 1, db: 1, roles: 1}).toArray()
        transform: json
      register: discovered_3_5_users
      changed_when: false
      check_mode: false

    - name: "3.5 | AUDIT | Review Superuser/Admin Roles | Report"
      ansible.builtin.debug:
        msg: >-
          3.5 REVIEW: {{ discovered_3_5_users['transformed_output'] | length }} user(s) hold one of
          {{ mongodb8_cis_3_5_roles | join(', ') }}. Check each one below is needed.

    - name: "3.5 | AUDIT | Review Superuser/Admin Roles | Report each user"
      ansible.builtin.debug:
        msg: >-
          3.5 REVIEW: {{ item['user'] }}@{{ item['db'] }} holds
          {{ item['roles'] | selectattr('role', 'in', mongodb8_cis_3_5_roles) | map(attribute='role')
             | zip(item['roles'] | selectattr('role', 'in', mongodb8_cis_3_5_roles) | map(attribute='db')) | map('join', '@') | join(', ') }}.
      loop: "{{ discovered_3_5_users['transformed_output'] }}"
      loop_control:
        label: "{{ item['user'] }}@{{ item['db'] }}"
