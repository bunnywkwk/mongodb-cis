---
# Preliminary task that should always run

- name: "PRELIM | AUDIT | Gather minimal facts if the play skipped them"
  when: ansible_facts['os_family'] is not defined
  ansible.builtin.setup:
    gather_subset:
      - min

- name: "PRELIM | AUDIT | Check ansible-core version"
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.16.1', '>=')
    fail_msg: "mongodb_cis needs ansible-core >= 2.16.1 (found {{ ansible_version.full }})."
    quiet: true

- name: "PRELIM | AUDIT | Check supported OS"
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
      - ansible_facts['distribution_major_version'] in mongodb_cis_supported_os_majors
      - ansible_facts['architecture'] == mongodb_cis_supported_arch
    fail_msg: >-
      Unsupported target: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      {{ ansible_facts['architecture'] }}. Supported: RHEL-family {{ mongodb_cis_supported_os_majors | join('/') }}, {{ mongodb_cis_supported_arch }}.
    quiet: true

- name: "PRELIM | AUDIT | Check ansible-core version for RHEL 8"
  when: ansible_facts['distribution_major_version'] == '8'
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.17', '<')
    fail_msg: >-
      RHEL 8 needs ansible-core 2.16.x (found {{ ansible_version.full }}): the dnf module fails on RHEL 8
      with 2.17+. Run from the el8 environment (docs/control-node-setup.md).
    quiet: true

- name: "PRELIM | PATCH | Install MongoDB when requested"
  when: mongodb_cis_install | bool
  ansible.builtin.import_tasks:
    file: install.yml

- name: "PRELIM | AUDIT | Gather installed packages"
  ansible.builtin.package_facts:
    manager: rpm

- name: "PRELIM | AUDIT | Detect MongoDB server package"
  ansible.builtin.set_fact:
    discovered_mongodb_installed: "{{ mongodb_cis_server_package in ansible_facts['packages'] }}"
    discovered_mongodb_version: "{{ (ansible_facts['packages'][mongodb_cis_server_package] | default([{'version': 'none'}]))[0]['version'] }}"

- name: "PRELIM | AUDIT | Stop when MongoDB is not installed"
  when: not discovered_mongodb_installed
  block:
    - name: "PRELIM | AUDIT | Stop when MongoDB is not installed | Report"
      ansible.builtin.debug:
        msg: "{{ mongodb_cis_server_package }} is not installed on {{ inventory_hostname }}: nothing to harden. mongodb_cis_install={{ mongodb_cis_install | bool }}."

    - name: "PRELIM | AUDIT | Stop when MongoDB is not installed | End this host"
      ansible.builtin.meta: end_host

- name: "PRELIM | AUDIT | Read mongod.conf"
  ansible.builtin.slurp:
    src: "{{ mongodb_cis_conf_path }}"
  register: discovered_mongod_conf_raw

- name: "PRELIM | AUDIT | Parse mongod.conf"
  ansible.builtin.set_fact:
    discovered_mongod_conf: "{{ discovered_mongod_conf_raw['content'] | b64decode | from_yaml | default({}, true) }}"

- name: "PRELIM | AUDIT | Read mongod service properties"
  ansible.builtin.systemd_service:
    name: "{{ mongodb_cis_service }}"
  register: discovered_mongod_service

- name: "PRELIM | AUDIT | Show what was found"
  ansible.builtin.debug:
    msg:
      - "MongoDB server: {{ discovered_mongodb_version }}"
      - "Config file: {{ mongodb_cis_conf_path }}"
      - "dbPath: {{ discovered_mongod_conf['storage']['dbPath'] | default(mongodb_cis_default_db_path) }}"
      - "Log file: {{ discovered_mongod_conf['systemLog']['path'] | default(mongodb_cis_default_log_path) }}"
      - "Service user: {{ mongodb_cis_service_user }}"
